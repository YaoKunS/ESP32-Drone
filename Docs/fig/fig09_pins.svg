<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">引脚定义与硬件接线（默认板型 PCB_YaoKun_LCKFB_ESP32S3）</text>

  <!-- 板型选择 -->
  <rect x="20" y="42" width="960" height="72" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="36" y="62" font-size="12" font-weight="bold" fill="#6d28d9">板型切换：config.h 中只改一行 #define，4 种已实现板型 + 4 种规划板型，全部通过条件编译隔离</text>

  <rect x="36" y="72" width="184" height="32" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="128" y="86" font-size="10" font-weight="bold" fill="#4c1d95" text-anchor="middle">PCB_YaoKun_LCKFB_ESP32S3</text>
  <text x="128" y="99" font-size="9.5" fill="#5b21b6" text-anchor="middle">★ 默认　Yaokun K1.0 立创 S3 R8N8</text>

  <rect x="228" y="72" width="184" height="32" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="320" y="86" font-size="10" fill="#6d28d9" text-anchor="middle">PCB_YaoKun_S3mini</text>
  <text x="320" y="99" font-size="9.5" fill="#7c3aed" text-anchor="middle">S1.0C　S3 Supermini　马达 4/3/9/8</text>

  <rect x="420" y="72" width="184" height="32" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="512" y="86" font-size="10" fill="#6d28d9" text-anchor="middle">PCB_YaoKun_S3mini_B</text>
  <text x="512" y="99" font-size="9.5" fill="#7c3aed" text-anchor="middle">S1.0B　内部测试　马达 4/3/11/10</text>

  <rect x="612" y="72" width="184" height="32" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="704" y="86" font-size="10" fill="#6d28d9" text-anchor="middle">PCB_YaoKun_S3mini_A</text>
  <text x="704" y="99" font-size="9.5" fill="#7c3aed" text-anchor="middle">S1.0A　内部测试　马达 4/1/9/8</text>

  <rect x="804" y="72" width="160" height="32" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="884" y="86" font-size="10" fill="#6d28d9" text-anchor="middle">ESP32Dev / C3mini</text>
  <text x="884" y="99" font-size="9.5" fill="#7c3aed" text-anchor="middle">规划中，尚未落地</text>

  <!-- 电机 -->
  <rect x="20" y="130" width="470" height="216" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="36" y="152" font-size="12.5" font-weight="bold" fill="#0f172a">电机　LEDC　通道 0~3　20 kHz / 10-bit</text>

  <text x="36" y="176" font-size="11" font-weight="bold" fill="#b91c1c">位置</text>
  <text x="110" y="176" font-size="11" font-weight="bold" fill="#b91c1c">GPIO</text>
  <text x="176" y="176" font-size="11" font-weight="bold" fill="#b91c1c">混控符号</text>
  <text x="286" y="176" font-size="11" font-weight="bold" fill="#334155">PWM 通道</text>
  <line x1="30" y1="184" x2="480" y2="184" stroke="#cbd5e1" stroke-width="1"/>

  <text x="36" y="204" font-size="11.5" fill="#334155">M0 左前 FL</text>
  <text x="110" y="204" font-size="11.5" font-weight="bold" fill="#2563eb">16</text>
  <text x="176" y="204" font-size="11" font-family="monospace" fill="#475569">油 + R + P − Y</text>
  <text x="286" y="204" font-size="11" fill="#475569">ch0</text>

  <text x="36" y="226" font-size="11.5" fill="#334155">M1 右前 FR</text>
  <text x="110" y="226" font-size="11.5" font-weight="bold" fill="#2563eb">6</text>
  <text x="176" y="226" font-size="11" font-family="monospace" fill="#475569">油 − R + P + Y</text>
  <text x="286" y="226" font-size="11" fill="#475569">ch1</text>

  <text x="36" y="248" font-size="11.5" fill="#334155">M2 右后 RR</text>
  <text x="110" y="248" font-size="11.5" font-weight="bold" fill="#2563eb">5</text>
  <text x="176" y="248" font-size="11" font-family="monospace" fill="#475569">油 − R − P − Y</text>
  <text x="286" y="248" font-size="11" fill="#475569">ch2</text>

  <text x="36" y="270" font-size="11.5" fill="#334155">M3 左后 RL</text>
  <text x="110" y="270" font-size="11.5" font-weight="bold" fill="#2563eb">15</text>
  <text x="176" y="270" font-size="11" font-family="monospace" fill="#475569">油 + R − P + Y</text>
  <text x="286" y="270" font-size="11" fill="#475569">ch3</text>

  <line x1="30" y1="284" x2="480" y2="284" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="304" font-size="11" font-weight="bold" fill="#0f172a">指示灯（与电机通道完全隔离）</text>
  <text x="36" y="322" font-size="10.5" fill="#475569">led1 红 GPIO41 → PWM ch4　　led2 绿 GPIO7 → PWM ch5</text>
  <text x="36" y="338" font-size="10.5" fill="#475569">led3 蓝 GPIO14 → 普通 GPIO（网页连接 / 飞行 / 待机三级态）</text>

  <!-- 传感器 -->
  <rect x="510" y="130" width="470" height="216" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="526" y="152" font-size="12.5" font-weight="bold" fill="#0f172a">传感器与总线</text>

  <text x="526" y="176" font-size="11" font-weight="bold" fill="#b91c1c">用途</text>
  <text x="620" y="176" font-size="11" font-weight="bold" fill="#b91c1c">GPIO</text>
  <text x="716" y="176" font-size="11" font-weight="bold" fill="#334155">说明</text>
  <line x1="520" y1="184" x2="970" y2="184" stroke="#cbd5e1" stroke-width="1"/>

  <text x="526" y="204" font-size="11.5" fill="#334155">I2C SDA（IMU）</text>
  <text x="620" y="204" font-size="11.5" font-weight="bold" fill="#2563eb">9</text>
  <text x="716" y="204" font-size="11" fill="#475569">MPU6050，地址 0x68，400 kHz</text>

  <text x="526" y="226" font-size="11.5" fill="#334155">I2C SCL（IMU）</text>
  <text x="620" y="226" font-size="11.5" font-weight="bold" fill="#2563eb">8</text>
  <text x="716" y="226" font-size="11" fill="#475569">同一总线，开机自动探测</text>

  <text x="526" y="248" font-size="11.5" fill="#334155">电池电压 ADC</text>
  <text x="620" y="248" font-size="11.5" font-weight="bold" fill="#2563eb">2</text>
  <text x="716" y="248" font-size="11" fill="#475569">ADC1_CH2，12-bit，11 dB 衰减</text>

  <text x="526" y="270" font-size="11.5" fill="#334155">蜂鸣器</text>
  <text x="620" y="270" font-size="11.5" font-weight="bold" fill="#2563eb">39</text>
  <text x="716" y="270" font-size="11" fill="#475569">无源蜂鸣器，GPIO 驱动</text>

  <line x1="520" y1="284" x2="970" y2="284" stroke="#cbd5e1" stroke-width="1"/>
  <text x="526" y="304" font-size="11" font-weight="bold" fill="#a16207">预留引脚（已定义、当前未使用，为后续扩展留口）</text>
  <text x="526" y="322" font-size="10.5" fill="#475569">SPI：MOSI 18 / CLK 38 / MISO 21 / CS 17　　（MPU6500 与光流共用）</text>
  <text x="526" y="338" font-size="10.5" fill="#475569">第二组 I2C：SCL 4 / SDA 3　（VL53L1X 激光测距）　　ELRS：TX 12 / RX 11　　SBUS：GPIO1</text>

  <!-- 预留传感器说明 -->
  <rect x="20" y="362" width="470" height="130" rx="10" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="36" y="384" font-size="12.5" font-weight="bold" fill="#854d0e">预留传感器扩展方向（代码尚未接入）</text>
  <text x="36" y="406" font-size="10.5" fill="#713f12">· VL53L1X 激光测距　→ 接第二组 I2C（GPIO4/3）</text>
  <text x="36" y="424" font-size="10.5" fill="#713f12">　实现「离地检测 / 简易定高」，弥补纯手动油门的垂向失控</text>
  <text x="36" y="444" font-size="10.5" fill="#713f12">· PMW3901 光流　　→ 接 SPI（GPIO18/38/21/17）</text>
  <text x="36" y="462" font-size="10.5" fill="#713f12">　配合测距可做「无GPS 悬停」，是本机最值得做的下一步升级</text>
  <text x="36" y="482" font-size="10.5" fill="#713f12">· 气压计 SPL06-01 / BMP280　→ 与 IMU 同总线或第二组 I2C，做气压定高</text>

  <!-- 电压告警 -->
  <rect x="510" y="362" width="470" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="526" y="384" font-size="12.5" font-weight="bold" fill="#b91c1c">电池电压三级告警（1S 锂电，分压比 2.0）</text>
  <text x="526" y="404" font-size="11" fill="#334155">正常　≥ 3.70 V　　无声无灯，LED 恢复正常状态显示</text>
  <text x="526" y="424" font-size="11" fill="#334155">低电　&lt; 3.70 V　　蓝灯 1 s 慢闪 + 蜂鸣 1 s 周期</text>
  <text x="526" y="444" font-size="11" fill="#334155">警告　&lt; 3.50 V　　绿灯 1 s 慢闪 + 蜂鸣 0.5 s 周期</text>
  <text x="526" y="464" font-size="11" fill="#334155">危急　&lt; 3.30 V　　红绿灯 0.5 s 快闪 + 蜂鸣 0.2 s 周期</text>
  <text x="526" y="484" font-size="10.5" fill="#7f1d1d">电压告警优先级高于飞控状态灯，会覆盖 ARMED/故障的红绿显示</text>

  <!-- 关键常量 -->
  <text x="20" y="524" font-size="12.5" font-weight="bold" fill="#0f172a">关键系统常量一览（config.h，全部可用 Web 端在安全范围内调整）</text>

  <rect x="20" y="536" width="146" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="93" y="550" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">kLoopPeriodUs = 2000</text>
  <text x="93" y="562" font-size="9.5" fill="#475569" text-anchor="middle">控制周期 2000 µs = 500 Hz</text>

  <rect x="174" y="536" width="146" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="247" y="550" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">kDtMaxSec = 0.02</text>
  <text x="247" y="562" font-size="9.5" fill="#475569" text-anchor="middle">dt 上限 20 ms 超出即上锁</text>

  <rect x="328" y="536" width="146" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="401" y="550" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">kArmHoldMs = 800</text>
  <text x="401" y="562" font-size="9.5" fill="#475569" text-anchor="middle">解锁开关需保持时长</text>

  <rect x="482" y="536" width="146" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="555" y="550" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">kArmThrottleMax = 0.05</text>
  <text x="555" y="562" font-size="9.5" fill="#475569" text-anchor="middle">解锁 / 停机油门阈值</text>

  <rect x="636" y="536" width="146" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="709" y="550" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">kStickCenterMax = 0.15</text>
  <text x="709" y="562" font-size="9.5" fill="#475569" text-anchor="middle">解锁要求摇杆回中范围</text>

  <rect x="790" y="536" width="190" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="885" y="550" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">kRelevelHoldMs = 400</text>
  <text x="885" y="562" font-size="9.5" fill="#475569" text-anchor="middle">静止多久触发自动水平校准</text>

  <rect x="20" y="574" width="230" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="135" y="588" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">默认最大倾角 30°（5~80 可调）</text>
  <text x="135" y="600" font-size="9.5" fill="#475569" text-anchor="middle">超过 80° 触发倾斜保护自动上锁</text>

  <rect x="258" y="574" width="230" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="373" y="588" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">默认最大偏航 180 °/s（30~360）</text>
  <text x="373" y="600" font-size="9.5" fill="#475569" text-anchor="middle">电机测试上限 20% 油门 / 最长 2 s</text>

  <rect x="496" y="574" width="240" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="616" y="588" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">默认遥控超时 300 ms（100~2000）</text>
  <text x="616" y="600" font-size="9.5" fill="#475569" text-anchor="middle">默认遥测周期 50 ms = 20 Hz（20~500）</text>

  <rect x="744" y="574" width="236" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="862" y="588" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">扭矩缩放 min 0.20 / slope 2.0</text>
  <text x="862" y="600" font-size="9.5" fill="#475569" text-anchor="middle">Madgwick β 0.02~0.14　Mahony Kp 2.2</text>
</svg>