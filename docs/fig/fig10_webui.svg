<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="i" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="ib" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>

  <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">Web 控制界面：四大视图与操作闭环</text>

  <!-- 手机框 -->
  <rect x="20" y="42" width="300" height="518" rx="24" fill="#f8fafc" stroke="#334155" stroke-width="2.2"/>
  <rect x="34" y="88" width="272" height="24" rx="12" fill="#334155"/>

  <!-- 顶栏 -->
  <text x="170" y="70" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">顶栏：四个视图切换 + 全屏</text>
  <rect x="34" y="122" width="62" height="24" rx="5" fill="#2563eb"/>
  <text x="65" y="138" font-size="10" fill="#ffffff" text-anchor="middle">遥控</text>
  <rect x="100" y="122" width="62" height="24" rx="5" fill="#e2e8f0"/>
  <text x="131" y="138" font-size="10" fill="#475569" text-anchor="middle">设置</text>
  <rect x="166" y="122" width="62" height="24" rx="5" fill="#e2e8f0"/>
  <text x="197" y="138" font-size="10" fill="#475569" text-anchor="middle">测试</text>
  <rect x="232" y="122" width="62" height="24" rx="5" fill="#e2e8f0"/>
  <text x="263" y="138" font-size="10" fill="#475569" text-anchor="middle">主题</text>

  <!-- 遥控视图 -->
  <rect x="34" y="158" width="272" height="380" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- 左摇杆 -->
  <circle cx="90" cy="252" r="52" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="90" cy="252" r="26" fill="#2563eb" fill-opacity="0.75"/>
  <text x="90" y="196" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">左摇杆</text>
  <text x="90" y="318" font-size="9.5" fill="#475569" text-anchor="middle">纵：油门　横：偏航</text>

  <!-- 右摇杆 -->
  <circle cx="250" cy="252" r="52" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="250" cy="252" r="26" fill="#2563eb" fill-opacity="0.75"/>
  <text x="250" y="196" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">右摇杆</text>
  <text x="250" y="318" font-size="9.5" fill="#475569" text-anchor="middle">纵：俯仰　横：横滚</text>

  <!-- 中栏 -->
  <rect x="152" y="176" width="88" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="196" y="196" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">ARM 开关</text>
  <text x="196" y="216" font-size="10" fill="#166534" text-anchor="middle">解锁请求</text>

  <rect x="152" y="232" width="88" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="196" y="252" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">紧急上锁</text>
  <text x="196" y="272" font-size="10" fill="#7f1d1d" text-anchor="middle">发 K 指令</text>

  <rect x="34" y="336" width="272" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="352" font-size="9.5" fill="#475569">油门 / WebSocket 连接 / 飞行状态</text>
  <text x="44" y="370" font-size="9.5" fill="#475569">状态消息（ARMED / FAILSAFE 原因）</text>

  <rect x="34" y="386" width="272" height="146" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="404" font-size="10" font-weight="bold" fill="#0f172a">遥测面板（20 Hz 刷新）</text>
  <text x="44" y="422" font-size="9.5" fill="#475569">姿态 roll / pitch / yaw（度）</text>
  <text x="44" y="438" font-size="9.5" fill="#475569">dt 周期与实际循环频率 Hz</text>
  <text x="44" y="454" font-size="9.5" fill="#475569">遥控指令龄期 cmd_age（ms）</text>
  <text x="44" y="470" font-size="9.5" fill="#475569">四电机输出 M0~M3（0~1）</text>
  <text x="44" y="486" font-size="9.5" fill="#475569">电池电压 / 故障原因 fs</text>
  <text x="44" y="502" font-size="9.5" fill="#475569">电机测试状态标签</text>
  <text x="44" y="520" font-size="9.5" fill="#475569">校准状态 cal</text>

  <!-- 右侧说明 -->
  <text x="350" y="60" font-size="12.5" font-weight="bold" fill="#1e40af">① 遥控视图　—— 唯一的实时操控入口</text>
  <text x="350" y="82" font-size="11" fill="#475569">双摇杆采用 Pointer Events，同时支持鼠标拖拽与手机触摸；支持全屏与浏览器横竖屏自适应。</text>
  <text x="350" y="100" font-size="11" fill="#475569">摇杆释放时自动回中（横滚/俯仰/偏航归零），油门保持当前位置不回零，避免误触导致坠机。</text>

  <text x="350" y="136" font-size="12.5" font-weight="bold" fill="#1e3a8a">② 设置视图　—— 参数标定与在线调参</text>
  <rect x="350" y="148" width="290" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <text x="362" y="165" font-size="10.5" fill="#075985">姿态球（Canvas 实时绘制地平线）</text>
  <rect x="650" y="148" width="320" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <text x="662" y="165" font-size="10.5" fill="#075985">水平校准 / 陀螺校准按钮 + 校准状态回显</text>
  <rect x="350" y="180" width="290" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <text x="362" y="197" font-size="10.5" fill="#075985">蜂鸣器静音 / 起飞音效次数（1~10）</text>
  <rect x="650" y="180" width="320" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <text x="662" y="197" font-size="10.5" fill="#075985">姿态滤波器下拉选择（须上锁）</text>
  <rect x="350" y="212" width="290" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <text x="362" y="229" font-size="10.5" fill="#075985">「获取参数」/「保存参数」按钮</text>
  <rect x="650" y="212" width="320" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <text x="662" y="229" font-size="10.5" fill="#075985">9 个 PID 增益输入框（分组应用）</text>
  <rect x="350" y="244" width="620" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <text x="362" y="261" font-size="10.5" fill="#075985">7 项飞行限值：最大倾角 / 最大偏航速率 / 倾斜保护角 / 遥控超时 / 遥测周期 / 扭矩缩放两项</text>

  <text x="350" y="296" font-size="12.5" font-weight="bold" fill="#6d28d9">③ 测试视图　—— 单电机分步验证</text>
  <text x="350" y="318" font-size="11" fill="#475569">选择电机索引 0~3、设定油门与时长后启动单电机运转，到时自动停转；也可随时手动 STOP。</text>
  <text x="350" y="336" font-size="11" fill="#b91c1c">固件侧三重保护：输出 ≤20%、时长 100~2000 ms 钳位、已解锁 / 电机故障 / 摇杆有输入时直接拒绝。</text>

  <text x="350" y="372" font-size="12.5" font-weight="bold" fill="#6d28d9">④ 主题视图　—— 12 套配色，浏览器本地记忆</text>
  <text x="350" y="394" font-size="11" fill="#475569">以 CSS class 挂到 body 上实现整体换肤，选中项存入 localStorage；下次打开自动恢复，无需重新选择。</text>

  <!-- 设计要点 -->
  <rect x="350" y="410" width="620" height="150" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="368" y="432" font-size="12.5" font-weight="bold" fill="#1e40af">界面设计上的三个工程决策</text>
  <text x="368" y="454" font-size="11" fill="#1e3a8a">① 零外部依赖：HTML / CSS / JS 全部编译进固件（1651 行单文件），不引用任何 CDN 或图片资源。</text>
  <text x="368" y="474" font-size="11" fill="#1e3a8a">　　飞机飞到没有外网的地方、在野外没有信号时，界面依然完整可用——这是野外飞行的刚需，不是省事。</text>
  <text x="368" y="496" font-size="11" fill="#1e3a8a">② 指令发送与界面渲染彻底解耦：摇杆按 20 ms 固定节拍发包，与用户手势频率无关；</text>
  <text x="368" y="516" font-size="11" fill="#1e3a8a">　　这样即使手机掉帧、浏览器后台节流，指令帧率依然稳定，不会因渲染卡顿导致飞控侧判定超时上锁。</text>
  <text x="368" y="538" font-size="11" fill="#1e3a8a">③ 所有命令都有 ack 应答并映射为中文操作提示：参数没生效、命令被拒绝（如已解锁时校准）都能立刻看到原因。</text>
  <text x="368" y="556" font-size="11" fill="#1e3a8a">　　调参过程形成「改 → 应用 → 飞 → 观察」闭环，无需反复猜测参数是否真的写进去了。</text>
</svg>